<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roadmap | Orange Dev Network</title>
    <meta name="description" content="Community roadmap for Bitcoin Data Labs. See what we are building next.">
    
    <!-- Bitcoin Data Labs Font & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="https://bitcoindatalabs.org/styles/styles.css">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="icon" type="image/png" href="https://bitcoindatalabs.org/favicon.png">

    <style>
        body.landing-layout {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
        }

        .roadmap-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 3rem 4rem;
            flex: 1;
            width: 100%;
            box-sizing: border-box;
            color: #f8fafc;
        }

        .page-header {
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 20px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 1.5rem;
        }

        .header-text h1 {
            font-size: 32px;
            font-weight: 800;
            margin: 0;
            letter-spacing: -0.02em;
            color: var(--text-primary);
        }

        .header-text p {
            font-size: 16px;
            color: var(--text-secondary);
            margin: 8px 0 0 0;
        }

        .btn-propose {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--primary);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
            box-shadow: 0 4px 14px rgba(226, 88, 34, 0.3);
            white-space: nowrap;
        }

        .btn-propose:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(226, 88, 34, 0.4);
        }

        #roadmap-content {
            margin-top: 2rem;
        }

        .issue-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .issue-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 1rem 1.5rem;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            margin-bottom: 0.75rem;
            transition: border-color 0.2s, background 0.2s;
            text-decoration: none;
            color: inherit;
        }

        .issue-item:hover {
            border-color: rgba(255, 255, 255, 0.15);
            background: rgba(30, 41, 59, 0.8);
        }

        .issue-icon {
            color: var(--primary);
            font-size: 1.25rem;
        }

        .issue-details {
            flex: 1;
        }

        .issue-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: #f8fafc;
            margin: 0 0 4px 0;
        }

        .issue-meta {
            font-size: 0.85rem;
            color: #94a3b8;
            margin: 0;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 2rem;
            color: #94a3b8;
            background: rgba(15, 23, 42, 0.3);
            border-radius: 8px;
            border: 1px dashed rgba(255, 255, 255, 0.1);
        }

        .empty-state i {
            font-size: 2.5rem;
            color: #64748b;
            margin-bottom: 1rem;
        }

        @media (max-width: 768px) {
            .roadmap-container {
                padding: 2rem 1.5rem;
                margin: 20px;
            }
            .page-header {
                flex-direction: column;
            }
        }
    </style>
</head>

<body class="has-fixed-header landing-layout">
    <div id="header"></div>

    <div class="roadmap-container">
        <header class="page-header">
            <div class="header-text">
                <h1>Network Roadmap</h1>
                <p>Features actively prioritized for the Influence Map & Profiles.</p>
            </div>
            <a href="https://github.com/sorukumar/orange-dev-tracker/issues/new?template=network-feature.md" target="_blank" class="btn-propose">
                <i class="fas fa-plus"></i> Suggest Feature
            </a>
        </header>

        <main id="roadmap-content">
            <div id="loading" class="empty-state">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Syncing roadmap with GitHub...</p>
            </div>
            <ul id="issue-list" class="issue-list"></ul>
        </main>
    </div>

    <div id="footer"></div>

    <script src="https://bitcoindatalabs.org/components/app-components.js"></script>
    <script src="js/app-config.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const listEl = document.getElementById('issue-list');
            const loadEl = document.getElementById('loading');
            
            try {
                // Fetch issues labeled "Network"
                const response = await fetch('https://api.github.com/repos/sorukumar/orange-dev-tracker/issues?state=open&labels=Network&sort=created&direction=asc');
                if (!response.ok) throw new Error('Failed to fetch from GitHub API');
                
                const issues = await response.json();
                
                loadEl.style.display = 'none';

                if (issues.length === 0) {
                    listEl.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-check-circle"></i>
                            <p>No open roadmap items for Network currently.</p>
                            <p>Got an idea? Click <strong>Suggest Feature</strong> above to kickstart the discussion!</p>
                        </div>
                    `;
                    return;
                }

                issues.forEach(issue => {
                    // Ignore pull requests if any accidentally have the label
                    if(issue.pull_request) return;

                    const li = document.createElement('li');
                    li.innerHTML = `
                        <a href="${issue.html_url}" target="_blank" class="issue-item">
                            <div class="issue-icon">
                                <i class="far fa-dot-circle"></i>
                            </div>
                            <div class="issue-details">
                                <h3 class="issue-title">${issue.title}</h3>
                                <p class="issue-meta">#${issue.number} opened by ${issue.user.login}</p>
                            </div>
                            <i class="fas fa-external-link-alt" style="color: #64748b; font-size: 0.85rem;"></i>
                        </a>
                    `;
                    listEl.appendChild(li);
                });

            } catch (error) {
                console.error(error);
                loadEl.innerHTML = `
                    <i class="fas fa-exclamation-triangle" style="color: #f59e0b;"></i>
                    <p>Unable to load roadmap from GitHub.</p>
                    <a href="https://github.com/sorukumar/orange-dev-tracker/issues?q=is%3Aissue+is%3Aopen+label%3ANetwork" target="_blank" style="color: var(--primary); font-weight: 600; text-decoration: none;">View directly on GitHub →</a>
                `;
            }
        });
    </script>
</body>

</html>
